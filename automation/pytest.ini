[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --html=reports/report.html --self-contained-html
markers =
    api: API integration tests
    ui: Frontend browser UI tests
    workflow: End-to-end multi-actor workflows
    blockchain: Smart contract and ledger verification tests
    security: Role-based access and security controls
